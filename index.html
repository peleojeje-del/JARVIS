<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #050303;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 500px;
  min-height: 100vh;
  padding: 25px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  border: 1px solid #390000;
  box-shadow: 0 0 35px #650000;
}

header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  color: #ff3535;
  font-size: 24px;
}

h1 {
  margin: 35px 0 5px;
  font-size: 38px;
  letter-spacing: 5px;
  color: #ff2929;
  text-shadow: 0 0 15px red;
  text-align: center;
}

.subtitle {
  color: #aaa;
  letter-spacing: 3px;
  font-size: 11px;
}

.core {
  position: relative;
  width: 270px;
  height: 270px;
  margin: 55px auto;
  display: flex;
  justify-content: center;
  align-items: center;
}

.ring {
  position: absolute;
  border: 3px solid transparent;
  border-top-color: #ff1717;
  border-bottom-color: #850000;
  border-radius: 50%;
  box-shadow: 0 0 15px #a00000;
  animation: rotate 7s linear infinite;
}

.ring:nth-child(1) {
  width: 100%;
  height: 100%;
}

.ring:nth-child(2) {
  width: 80%;
  height: 80%;
  animation-direction: reverse;
  animation-duration: 5s;
}

.ring:nth-child(3) {
  width: 60%;
  height: 60%;
  border-width: 5px;
  animation-duration: 3s;
}

.energy {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: white;
  box-shadow:
    0 0 15px white,
    0 0 35px red,
    0 0 75px red;
  animation: pulse 2s infinite alternate;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  from { transform: scale(.8); }
  to { transform: scale(1.2); }
}

button {
  cursor: pointer;
  color: white;
  background: #170000;
  border: 1px solid #ff2929;
  border-radius: 12px;
  box-shadow: 0 0 15px #750000;
}

.activate {
  width: 90%;
  padding: 20px;
  font-size: 19px;
  margin-bottom: 25px;
}

button:active {
  background: #650000;
}

#status {
  color: #ff4444;
  margin-bottom: 20px;
  font-size: 13px;
}

.chat {
  display: flex;
  width: 100%;
  gap: 8px;
}

input {
  min-width: 0;
  flex: 1;
  padding: 15px;
  background: #100707;
  color: white;
  border: 1px solid #650000;
  border-radius: 10px;
  font-size: 14px;
}

.send {
  padding: 0 17px;
  font-size: 20px;
}

#messages {
  width: 100%;
  max-height: 160px;
  overflow-y: auto;
  margin-bottom: 15px;
  font-size: 14px;
  line-height: 1.5;
}

.message {
  padding: 9px;
  margin: 7px 0;
  background: #170707;
  border-left: 2px solid red;
  border-radius: 5px;
}

.panels {
  width: 100%;
  display: flex;
  gap: 8px;
  margin-top: auto;
  padding-top: 35px;
}

.panel {
  flex: 1;
  text-align: center;
  padding: 14px 3px;
  border: 1px solid #650000;
  border-radius: 9px;
  color: #ff4444;
  font-size: 12px;
}

footer {
  color: #8b2222;
  margin-top: 25px;
  letter-spacing: 4px;
  font-size: 12px;
}
</style>
</head>

<body>
<div class="app">

<header>
  <span>☰</span>
  <span>⚙</span>
</header>

<h1>J.A.R.V.I.S.</h1>
<div class="subtitle">PERSONAL AI ASSISTANT</div>

<div class="core">
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="energy"></div>
</div>

<div id="status">SYSTEM STANDBY</div>

<button class="activate" onclick="listen()">
  🎙 АКТИВИРОВАТЬ ПОМОЩНИКА
</button>

<div id="messages"></div>

<div class="chat">
  <input id="input" placeholder="Написать сообщение...">
  <button class="send" onclick="sendMessage()">➤</button>
</div>

<div class="panels">
  <div class="panel">AI CORE<br><br>● READY</div>
  <div class="panel">MEMORY<br><br>● READY</div>
  <div class="panel">SYSTEM<br><br>● ACTIVE</div>
</div>

<footer>J.A.R.V.I.S. v0.1</footer>

</div>

<script>
const status = document.getElementById("status");
const messages = document.getElementById("messages");

function addMessage(name, text) {
  const div = document.createElement("div");
  div.className = "message";
  div.textContent = name + ": " + text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "ru-RU";
  speech.rate = 0.9;
  speech.pitch = 0.8;

  speechSynthesis.speak(speech);
}

function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value.trim();

  if (!text) return;

  addMessage("Сэр", text);
  input.value = "";

  status.textContent = "PROCESSING...";

  setTimeout(() => {
    const answer = "Команда получена. Я пока работаю в демонстрационном режиме.";
    addMessage("J.A.R.V.I.S.", answer);
    status.textContent = "SYSTEM READY";
    speak(answer);
  }, 700);
}

function listen() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    status.textContent = "VOICE INPUT NOT SUPPORTED";
    addMessage("SYSTEM", "Распознавание речи недоступно в этом браузере.");
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "ru-RU";
  recognition.interimResults = false;

  status.textContent = "LISTENING...";

  recognition.onresult = (event) => {
    document.getElementById("input").value =
      event.results[0][0].transcript;

    status.textContent = "VOICE RECEIVED";
    sendMessage();
  };

  recognition.onerror = () => {
    status.textContent = "VOICE ERROR";
  };

  recognition.onend = () => {
    if (status.textContent === "LISTENING...") {
      status.textContent = "SYSTEM READY";
    }
  };

  recognition.start();
}

document.getElementById("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
